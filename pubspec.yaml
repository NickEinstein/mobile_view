name: vital_reg_mobile
description: Vital Registration mobile app.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.9.0
  flutter: 3.35.0

dependencies:
  bloc: ^9.0.0
  bloc_concurrency: ^0.3.0
  dio: ^5.9.0
  equatable: ^2.0.7
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.0
  flutter_localizations:
    sdk: flutter
  flutter_secure_storage: ^9.2.4
  formz: ^0.8.0
  get_it: ^8.0.3
  go_router: ^16.0.0
  intl: ^0.20.2
  logger: ^2.6.2
  path_provider: ^2.1.5
  sentry_flutter: ^9.0.0
  shared_preferences: ^2.5.3

dev_dependencies:
  bloc_test: ^10.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/auth/
    - assets/images/branding/
    - assets/images/onboarding/
    - assets/fonts/OFL-Poppins.txt
    - assets/fonts/OFL-OpenSans.txt

  # Family names must match AppFonts in lib/design_system/tokens/app_fonts.dart.
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: OpenSans
      fonts:
        - asset: assets/fonts/OpenSans-Regular.ttf
        - asset: assets/fonts/OpenSans-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/OpenSans-Bold.ttf
          weight: 700

# Launcher icons generated from assets/launcher/ (built from branding/logo_mark.png).
# Regenerate with: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/launcher/icon.png
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: assets/launcher/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21
